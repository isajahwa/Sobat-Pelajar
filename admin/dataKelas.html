<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="..\css\admin\style.css" />
    <title>Admin SobatPelajar</title>
</head>

<body>
    <div class="layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <div class="nama"><span class="text-primary">Sobat</span>Pelajar</div>
                <div class="sectionName">Dashboard Admin</div>
            </div>
            <nav class="sidebar-menu">
                <div class="menu-label">Menu Utama</div>
                <a href="dashboardAdmin.html" class="menu-item"><i
                        class="fa-solid fa-chart-line"></i>Dashboard</a>
                <a href="dataTutor.html" class="menu-item"><i class="fa-solid fa-chalkboard-user"></i>Data Tutor</a>
                <a href="dataSiswa.html" class="menu-item"><i class="fa-solid fa-users"></i>Data Siswa</a>
                <a href="dataKelas.html" class="menu-item aktif"><i class="fa-solid fa-calendar"></i>Data Kelas</a>
                <a href="laporanAdmin.html" class="menu-item"><i class="fa-solid fa-file-alt"></i>Laporan</a>
                <a href="riwayatTransaksi.html" class="menu-item"><i class="fa-solid fa-exchange-alt"></i>Riwayat
                    Transaksi</a>
            </nav>

            <div class="sidebar-bawah">
                <div class="info-user">
                    <div id="sideAvatar" class="avatar-user">M</div>
                    <div>
                        <div id="sideNama" class="nama-user">Memuat...</div>
                        <div id="sideEmail" class="email-user">Memuat...</div>
                    </div>
                </div>
                <a href="../index.html" class="btn-keluar"><i class="fa fa-sign-out-alt me-1"></i>Keluar</a>
            </div>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <div class="d-flex align-items-center">
                    <button class="btn-hamburger me-3 d-lg-none" id="btnMenu"><i class="fa fa-bars"></i></button>
                    <div>
                        <div class="judul-halaman">Dasboard</div>
                        <div class="sub-judul-halaman" id="currentDate">Memuat tanggal...</div>
                    </div>
                </div>
                <div class="topbar-kanan d-flex align-items-center gap-3">
                    <div class="notif-btn"><i class="fa-solid fa-bell fa-lg" style="color: rgb(255, 212, 59);"></i><span
                            class="notif-badge">3</span></div>
                    <div id="topAvatar" class="avatar-user"
                        style="width:36px;height:36px;font-size:.85rem;background:var(--biru);">M</div>
                </div>
            </div>

            <div class="area-halaman">
                <div class="row g-3 mb-4">
                    <div class="col-12 col-lg-12">
                        <div class="kartu-stat">
                            <div class="kartu-header">
                                <span class="kartu-judul"><i class="fa fa-clock me-2 text-primary"></i>Data Kelas</span>
                            </div>
                            <div class="kartu-body" id="listJadwal">
                                <div class="table-responsive">
                                    <table class="tabel">
                                        <thead>
                                            <tr>
                                                <th>ID Kelas</th>
                                                <th>ID Tutor</th>
                                                <th>Jumlah Siswa</th>
                                                <th>Jadwal Kelas</th>
                                                <th>Status</th>
                                            </tr>
                                        </thead>
                                        <tbody id="tabelPesanan">
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
</body>

</html>
