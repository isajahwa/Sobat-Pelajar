            <div class="sidebar-bawah">

          <div id="sideAvatar" class="avatar-user">M</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const dataAdmin = {
                username: 'admin123',
                password: 'admin123',
                peran: 'admin'
            }
            localStorage.setItem('adminData', JSON.stringify(dataAdmin));

      const loggedInUser = JSON.parse(localStorage.getItem('loggedInUser'));

      if (!loggedInUser) {
        alert('Akses ditolak!');
        window.location.href = './adminLogin.html';
        return;
      }

      const nama = loggedInUser.nama || 'Mentor';
      const email = loggedInUser.email || '';
      const inisial = nama.charAt(0).toUpperCase();

      document.getElementById('sideNama').innerText = nama;
      document.getElementById('sideEmail').innerText = email;
      document.getElementById('sideAvatar').innerText = inisial;
      document.getElementById('topAvatar').innerText = inisial;
    }
    );
    
    </script>
</body>
